    :root {

      --surface: #11162a;
      --surface-2: #1a2138;
      --border: #2a3050;
      --text: #F5F5F7;
      --muted: #9ba0b8;
      --faint: #6B7280;
      --primary: #FFB547;
      --indigo: #6D44D0;
      --green: #4ade80;
      --red: #f87171;
      --cyan: #22d3ee;
      --pink: #ec4899;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.4;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    h1 .accent { color: var(--primary); }
    .countdown-box {
      display: flex;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      color: var(--muted);
    }
    .countdown-box .big {
      color: var(--primary);
      font-weight: 800;
      font-size: 18px;
      font-family: ui-monospace, monospace;
    }
    .countdown-box .target { color: var(--text); font-weight: 600; }
    .filters { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .filter-btn, .action-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }
    .filter-btn.active { background: var(--primary); color: var(--bg); border-color: var(--primary); font-weight: 700; }
    .filter-btn:hover:not(.active), .action-btn:hover { border-color: var(--primary); }
    .action-btn { color: var(--muted); }
    .legend {
      padding: 10px 24px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      align-items: center;
    }
    .swatch { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .board {
      display: grid;
      grid-template-columns: repeat(7, minmax(240px, 1fr));
      gap: 12px;
      padding: 16px;
      overflow-x: auto;
      align-items: start;
    }
    .col {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 360px;
      border: 1px solid transparent;
      transition: border-color 120ms;
    }
    .col.drag-over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 5%, var(--surface)); }
    .col h3 {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0 0 4px 0;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .col-count {
      color: var(--faint);
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
    }
    .add-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      margin-top: 4px;
    }
    .add-btn:hover { border-color: var(--primary); color: var(--primary); }
    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      cursor: grab;
      transition: all 120ms;
      position: relative;
    }
    .card:active { cursor: grabbing; }
    .card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .card.dragging { opacity: 0.35; }
    .card-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pill {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
    }
    .pill.entertainment { background: rgba(255,181,71,0.16); color: var(--primary); }
    .pill.infotainment { background: rgba(109,68,208,0.20); color: #b497f0; }
    .theme {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      display: inline-block;
      opacity: 0.85;
    }
    .theme[data-t="Survival"] { background: rgba(255,181,71,0.12); color: var(--primary); }
    .theme[data-t="Heroes"] { background: rgba(248,113,113,0.14); color: var(--red); }
    .theme[data-t="Phenomena"] { background: rgba(109,68,208,0.20); color: #b497f0; }
    .theme[data-t="Records"] { background: rgba(74,222,128,0.14); color: var(--green); }
    .theme[data-t="Curiosities"] { background: rgba(34,211,238,0.14); color: var(--cyan); }
    .theme[data-t="Adoption"] { background: rgba(255,181,71,0.12); color: var(--primary); }
    .theme[data-t="Leadership"] { background: rgba(248,113,113,0.14); color: var(--red); }
    .theme[data-t="Strategy"] { background: rgba(109,68,208,0.20); color: #b497f0; }
    .theme[data-t="Tactics"] { background: rgba(74,222,128,0.14); color: var(--green); }
    .theme[data-t="Risk"] { background: rgba(34,211,238,0.14); color: var(--cyan); }
    .theme[data-t="Build-in-Public"] { background: rgba(236,72,153,0.16); color: var(--pink); }
    .theme[data-t="AI Update"] { background: rgba(155,160,184,0.20); color: var(--muted); }
    .card-title { font-weight: 600; font-size: 13px; margin: 6px 0 2px 0; line-height: 1.3; }
    .card-sub { font-size: 11px; color: var(--muted); margin: 0 0 4px 0; }
    .card-notes { font-size: 11px; color: var(--faint); margin-top: 6px; font-style: italic; line-height: 1.35; }
    .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 120ms;
    }
    .card:hover .card-actions { opacity: 1; }
    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .icon-btn:hover { color: var(--red); border-color: var(--red); }
    .empty-msg { color: var(--faint); font-size: 11px; font-style: italic; padding: 8px; text-align: center; }
    /* Modal for add/edit */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: min(500px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal h2 { margin: 0; font-size: 16px; }
    .modal label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
    }
    .modal textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .modal-actions .action-btn { padding: 8px 16px; }
    .modal-actions .primary { background: var(--primary); color: var(--bg); border-color: var(--primary); font-weight: 700; }
    @media (max-width: 1100px) {
      .board { grid-template-columns: repeat(7, 260px); }
    }
  </style>

      // ── INFOTAINMENT — Build-in-public (InvestAI arc) ───────────
      { id:'info-ep1', pillar:'infotainment', theme:'Build-in-Public',
        title:'Before the bot',
        sub:'NYUKD InvestAI · EP01 — the founder problem',
        notes:'Path-2 story arc opener · packet in Path2_Story_Arc/',
        status:'backlog' },
      { id:'info-ep2', pillar:'infotainment', theme:'Build-in-Public',
        title:'The first conversation',
        sub:'NYUKD InvestAI · EP02',
        notes:'',
        status:'backlog' },
      { id:'info-ep3', pillar:'infotainment', theme:'Build-in-Public',
        title:'Our first argument',
        sub:'NYUKD InvestAI · EP03 — risk per trade',
        notes:'',
        status:'backlog' },

      // ── INFOTAINMENT — Transformation futures (global / merit-based) ──
      { id:'info-fut-2027office', pillar:'infotainment', theme:'Adoption',
        title:'The 2027 office',
        sub:'How AI redraws the white-collar job in 18 months',
        notes:'EP_the_2027_office_DRAFT.mp4 · 49.5s · live on Watch library, pending Cloudflare deploy',
        status:'weblive' },
      { id:'info-fut-compliance', pillar:'infotainment', theme:'Risk',
        title:'The compliance cliff',
        sub:'EU AI Act + US frameworks · what enterprises actually do in year 1',
        notes:'EU AI Act tiered obligations; US OMB / NIST AI RMF; sector-specific (FCA, SEC) overlays. Concrete checklist for global enterprises.',
        status:'backlog' },
      { id:'info-fut-aiNative', pillar:'infotainment', theme:'Strategy',
        title:'AI-native vs AI-retrofit',
        sub:'Why companies built AI-first beat incumbents by a factor',
        notes:'Case studies: born-AI companies (e.g. Cursor, Perplexity-style) vs retrofit incumbents. Cost-to-serve, ops model, hiring shape.',
        status:'backlog' },
      { id:'info-fut-jcurve', pillar:'infotainment', theme:'Adoption',
        title:'The AI productivity J-curve',
        sub:'Why AI ROI lags before it leaps — and how to survive the dip',
        notes:'Brynjolfsson "intangible capital" thesis; observed in cloud + ERP transitions; specific moves that shorten the J.',
        status:'backlog' },
      { id:'info-fut-sovereignAI', pillar:'infotainment', theme:'Strategy',
        title:'Sovereign AI',
        sub:'Countries building national AI capability — and why it shapes the next decade',
        notes:'India IndiaAI Mission · UAE / Saudi · EU Gigafactories · UK AI Opportunities · US frontier-model compacts. Strategic framing for leaders.',
        status:'backlog' },
    ];

    // ── State ────────────────────────────────────────────────────
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(SEED));
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    let state = load();
    let currentFilter = 'all';

    // ── Countdown ────────────────────────────────────────────────
    function updateCountdown() {
      const now = new Date();
      const diffMs = LAUNCH - now;
      const days = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      document.getElementById('daysLeft').textContent = days >= 0 ? days : `${Math.abs(days)} past`;
    }
    updateCountdown();
    setInterval(updateCountdown, 60_000);

    // ── Render ───────────────────────────────────────────────────
    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      COLS.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.className = 'col';
        colDiv.dataset.col = col.id;
        const cardsInCol = state.filter(c =>
          c.status === col.id && (currentFilter === 'all' || c.pillar === currentFilter)
        );
        colDiv.innerHTML = `
          <h3>${col.name} <span class="col-count">${cardsInCol.length}</span></h3>
        `;
        cardsInCol.forEach(c => {
          const card = document.createElement('article');
          card.className = 'card';
          card.draggable = true;
          card.dataset.id = c.id;
          card.innerHTML = `
            <div class="card-actions">
              <button class="icon-btn" data-del="${c.id}" title="Delete">×</button>
            </div>
            <div class="card-head">
              <span class="pill ${c.pillar}">${c.pillar === 'entertainment' ? 'Entertainment' : 'Infotainment'}</span>
              <span class="theme" data-t="${c.theme}">${c.theme}</span>
            </div>
            <div class="card-title">${esc(c.title)}</div>
            ${c.sub ? `<div class="card-sub">${esc(c.sub)}</div>` : ''}
            ${c.notes ? `<div class="card-notes">${esc(c.notes)}</div>` : ''}
          `;
          colDiv.appendChild(card);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'add-btn';
        addBtn.textContent = '＋ Add card';
        addBtn.dataset.add = col.id;
        colDiv.appendChild(addBtn);
        board.appendChild(colDiv);
      });
      attachDnd();
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    // ── Drag and drop ────────────────────────────────────────────
    let dragId = null;
    function attachDnd() {
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('dragstart', e => {
          dragId = card.dataset.id;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-over'));
        });
      });
      document.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => {
          e.preventDefault();
          col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          if (!dragId) return;
          const card = state.find(c => c.id === dragId);
          if (card) {
            card.status = col.dataset.col;
            save();
            render();
          }
          dragId = null;
        });
      });
    }

    // ── Filters ──────────────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // ── Add / delete cards ───────────────────────────────────────
    const modal = document.getElementById('modal');
    let addingTo = null;
    document.addEventListener('click', e => {
      if (e.target.matches('[data-add]')) {
        addingTo = e.target.dataset.add;
        document.getElementById('m_title').value = '';
        document.getElementById('m_sub').value = '';
        document.getElementById('m_notes').value = '';
        // default pillar/theme matches filter if active
        document.getElementById('m_pillar').value =
          currentFilter !== 'all' ? currentFilter : 'entertainment';
        modal.classList.add('show');
        setTimeout(() => document.getElementById('m_title').focus(), 30);
      }
      if (e.target.matches('[data-del]')) {
        if (!confirm('Delete this card?')) return;
        state = state.filter(c => c.id !== e.target.dataset.del);
        save(); render();
      }
    });
    document.getElementById('m_cancel').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('m_save').addEventListener('click', () => {
      const title = document.getElementById('m_title').value.trim();
      if (!title) return;
      state.push({
        id: 'c-' + Date.now().toString(36),
        pillar: document.getElementById('m_pillar').value,
        theme: document.getElementById('m_theme').value,
        title,
        sub: document.getElementById('m_sub').value.trim(),
        notes: document.getElementById('m_notes').value.trim(),
        status: addingTo || 'backlog',
      });
      save(); render();
      modal.classList.remove('show');
    });
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

    // ── Reset ────────────────────────────────────────────────────
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Reset the board to the seeded state? Your changes will be lost.')) return;
      state = JSON.parse(JSON.stringify(SEED));
      save(); render();
    });

    render();
  </script>
</body>
